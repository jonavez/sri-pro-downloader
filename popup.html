<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRI Pro Downloader</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --primary: #1d4ed8;
      --primary-hover: #1e3a8a;
      --secondary: #3b82f6;
      --success: #10b981;
      --whatsapp: #25D366;
      --whatsapp-hover: #128C7E;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-light: #475569;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
      width: 400px;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 24px 20px;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .header::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
      transform: rotate(30deg);
      pointer-events: none;
    }

    .header h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 0.9rem;
      font-weight: 400;
      opacity: 0.9;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      border: 1px solid var(--border);
      transition: box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-item {
      text-align: center;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 12px;
      transition: transform 0.2s ease;
    }
    
    .stat-item:hover {
      transform: translateY(-2px);
      background: #e2e8f0;
    }

    .stat-value {
      display: block;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-light);
      margin-top: 4px;
      display: inline-block;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 12px;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(29, 78, 216, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 8px -1px rgba(29, 78, 216, 0.4);
    }

    .btn-success {
      background-color: var(--success);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
    }
    
    .btn-success:hover {
      background-color: #059669;
      transform: translateY(-2px);
      box-shadow: 0 6px 8px -1px rgba(16, 185, 129, 0.4);
    }

    .btn-outline {
      background-color: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background-color: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .progress-container {
      margin: 16px 0;
      display: none;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .progress-bar-bg {
      background: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--success), #34d399);
      height: 100%;
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-text {
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      color: var(--text-light);
    }

    .invoice-list {
      max-height: 220px;
      overflow-y: auto;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .invoice-item {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.2s;
    }

    .invoice-item:hover {
      background-color: #f8fafc;
    }

    .invoice-item:last-child {
      border-bottom: none;
    }

    .invoice-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .invoice-amount {
      font-weight: 700;
      color: var(--text);
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border);
    }
    
    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--whatsapp);
      color: white;
      padding: 8px 16px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(37, 211, 102, 0.3);
    }
    
    .whatsapp-btn:hover {
      background-color: var(--whatsapp-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 8px -1px rgba(37, 211, 102, 0.4);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>SRI Pro Downloader</h1>
    <p>Gestión inteligente de comprobantes</p>
  </div>

  <div class="container">
    <!-- Dashboard Stats -->
    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-value" id="totalInvoices">0</span>
        <span class="stat-label">Facturas</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="totalAmount">$0.00</span>
        <span class="stat-label">Monto Total</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="card">
      <button id="scanBtn" class="btn btn-primary">
        🔍 Escanear Página Actual
      </button>

      <div id="actionButtons" style="display: none;">
        <button id="downloadBtn" class="btn btn-success">
          ⬇️ Descargar XMLs
        </button>
        <button id="exportBtn" class="btn btn-outline">
          📊 Exportar a Excel (CSV)
        </button>
        <button id="downloadAllBtn" class="btn btn-outline"
          style="margin-top: 10px; border-color: var(--primary); color: var(--primary);">
          📑 Descargar Todas las Páginas
        </button>
      </div>
    </div>

    <!-- Progress -->
    <div id="progressContainer" class="progress-container">
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
      <div id="progressText" class="progress-text">Iniciando...</div>
    </div>


    <!-- Configuración -->
    <div class="card" style="margin-top: 15px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="margin: 0; font-size: 0.9rem;">Configuración</h3>
        <button id="toggleConfigBtn" class="btn-outline"
          style="width: auto; padding: 4px 8px; font-size: 0.7rem;">⚙️</button>
      </div>

      <div id="configPanel" style="display: none;">
        <label style="display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--text-light);">Carpeta de
          Descarga (dentro de Downloads):</label>
        <div style="display: flex; gap: 5px;">
          <input type="text" id="folderInput" placeholder="Ej: Facturas SRI/2025"
            style="flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem;">
          <button id="saveConfigBtn" class="btn-primary" style="width: auto; padding: 8px 12px;">Guardar</button>
        </div>
        <div id="configStatus" style="font-size: 0.75rem; margin-top: 5px; min-height: 15px;"></div>
      </div>
    </div>

    <!-- Debug Log (Oculto por defecto) -->
    <div id="debugLog"
      style="display: none; background: #333; color: #fff; padding: 10px; font-size: 0.7rem; margin-top: 10px; border-radius: 6px; max-height: 100px; overflow-y: auto;">
    </div>

    <!-- List -->
    <div class="card" id="listContainer" style="display: none;">
      <h3 style="margin: 0 0 10px 0; font-size: 0.9rem;">Detalle</h3>
      <div id="facturasList" class="invoice-list"></div>
    </div>
  </div>

  <div class="footer">
    <div style="margin-bottom: 12px; font-weight: 500; font-size: 0.85rem; color: var(--text-light);">Desarrollado y Soportado por:</div>

  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
